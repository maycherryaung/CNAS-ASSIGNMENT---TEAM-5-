name: cnas-assignment

services:
  web:
    build: .
    image: cnas-php-mysql:local
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: mydb
      DB_USER: cnas_user
      DB_PASSWORD: cnas_password
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@file_get_contents('http://127.0.0.1:8080/health.php') === false ? 1 : 0);\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpass_dev_only
      MYSQL_DATABASE: mydb
      MYSQL_USER: cnas_user
      MYSQL_PASSWORD: cnas_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./users.sql:/docker-entrypoint-initdb.d/01-users.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql_data:

