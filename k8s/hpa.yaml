apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cnas-web
  namespace: cnas
  labels:
    app.kubernetes.io/name: cnas-web
    app.kubernetes.io/component: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cnas-web
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60

