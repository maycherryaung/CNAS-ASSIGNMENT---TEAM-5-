#YAML language for kubernetes

apiVersion: v1
kind: ConfigMap
metadata:
  name: cnas-mysql-initdb
  labels:
    app.kubernetes.io/name: cnas-mysql-initdb
data:
  01-users.sql: |         #01-users.sql says this is a database script file, | says treat everything that follows as one large, multi-line block of text
    CREATE DATABASE IF NOT EXISTS mydb CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; 
    USE mydb;

    CREATE TABLE IF NOT EXISTS users (
        id INT AUTO_INCREMENT PRIMARY KEY,
        name VARCHAR(100) NOT NULL,
        email VARCHAR(191) NOT NULL UNIQUE,
        created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

    INSERT INTO users (name, email) VALUES
        ('May Cherry Aung', 'maycherryaung@connect.np.edu.sg'),
        ('Aw Ming Jie', 'awmingjie@connect.np.edu.sg'),
        ('Abin Aneesh', 'abinaneesh@connect.np.edu.sg'),
        ('Gandhimathi Murugavel Dhushyanth', 'gandhimathimurugaveldhushyanth@connect.np.edu.sg')
    ON DUPLICATE KEY UPDATE
        name = VALUES(name);

#USE mydb tells the system to execute the remaining commands inside this specific database.
#An id number that increases automatically.
#A name that cannot be empty.
#An email that cannot be empty and must be unique (no duplicates allowed).
#Timestamps that automatically record when the user is created and updated.
#Email is already in the database, the system will not crash. 
#It will simply update the existing record instead.