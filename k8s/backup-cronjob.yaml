apiVersion: v1
kind: PersistentVolume
metadata:
  name: cnas-backup-pv
spec:
  capacity: { storage: 1Gi }
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: cnas-local-storage
  local: { path: /mnt/cnas-backup }
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [vm-childnode1]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cnas-backup-pvc
  namespace: cnas
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: cnas-local-storage
  resources: { requests: { storage: 1Gi } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backup-to-mysql
  namespace: cnas
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: cnas-backup }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: cnas-mysql }
      ports:
        - { protocol: TCP, port: 3306 }
    - ports:
        - { protocol: UDP, port: 53 }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cnas-mysql-backup
  namespace: cnas
spec:
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels: { app.kubernetes.io/name: cnas-backup }
        spec:
          restartPolicy: OnFailure
          nodeSelector: { kubernetes.io/hostname: vm-childnode1 }
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: backup
              image: mysql:8.4
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
              env:
                - name: DB_USER
                  valueFrom: { secretKeyRef: { name: cnas-db-secret, key: DB_USER } }
                - name: DB_PASSWORD
                  valueFrom: { secretKeyRef: { name: cnas-db-secret, key: DB_PASSWORD } }
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  F=/backup/mydb-$(date +%Y%m%d-%H%M%S).sql.gz
                  mysqldump -h cnas-mysql -u"$DB_USER" -p"$DB_PASSWORD" \
                    --single-transaction --no-tablespaces mydb | gzip > "$F"
                  echo "backup written: $F"
                  ls -lh /backup
                  find /backup -name '*.sql.gz' -mtime +7 -delete
              volumeMounts:
                - { name: backup, mountPath: /backup }
          volumes:
            - name: backup
              persistentVolumeClaim: { claimName: cnas-backup-pvc }
