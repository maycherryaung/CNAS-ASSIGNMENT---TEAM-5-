apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cnas-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cnas-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: cnas-lab-ca
  secretName: cnas-ca-secret
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: cnas-selfsigned
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cnas-ca-issuer
spec:
  ca:
    secretName: cnas-ca-secret
