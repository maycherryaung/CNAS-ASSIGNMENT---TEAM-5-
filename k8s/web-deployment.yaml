apiVersion: apps/v1
kind: Deployment
# Deployment = for stateless apps (web servers, APIs). Copies can be replaced anytime.
metadata:
  name: cnas-web
  namespace: cnas
  labels:
    app.kubernetes.io/name: cnas-web
    app.kubernetes.io/component: web
spec:
  replicas: 3  # Start with 3 copies. HPA will scale from 3 to 6 based on CPU usage.
  selector:
    matchLabels:
      app.kubernetes.io/name: cnas-web
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cnas-web
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: cnas-web
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        # Try to spread pods across different nodes (redundancy)
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:  # Prefer but don't require
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: cnas-web
                    app.kubernetes.io/component: web
                topologyKey: kubernetes.io/hostname  # Spread across different machines
      containers:
        - name: web
          # Your PHP app container image (from Docker registry)
          image: maycherryaung98/cnas-php-mysql@sha256:1e460c60ed0029c8a42301e39a8c069f4e965665a2496cfb6bc3e6261bf52208
          imagePullPolicy: IfNotPresent  # Use local image if available, don't pull
          ports:
            - name: http
              containerPort: 8080  # PHP app listens on port 8080
          env:
            # Pass database connection info to the PHP app
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:  # Where MySQL is running
                  name: cnas-app-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:  # MySQL port
                  name: cnas-app-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:  # Database name
                  name: cnas-app-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:  # Database username (sensitive)
                  name: cnas-db-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:  # Database password (sensitive)
                  name: cnas-db-secret
                  key: DB_PASSWORD
          readinessProbe:
            # Check: is pod ready to serve traffic? (database connection working?)
            httpGet:
              path: /health.php?deep=1  # Call this endpoint
              port: http
            initialDelaySeconds: 15  # Wait 15 seconds before first check
            periodSeconds: 10  # Check every 10 seconds
            timeoutSeconds: 5  # Wait max 5 seconds for response
            failureThreshold: 6  # After 6 failed checks, mark as not ready (don't send traffic)
          livenessProbe:
            # Check: is pod still alive? (not frozen/stuck?)
            httpGet:
              path: /health.php  # Call this endpoint
              port: http
            initialDelaySeconds: 30  # Wait 30 seconds before first check (let it fully start)
            periodSeconds: 20  # Check every 20 seconds
            timeoutSeconds: 5  # Wait max 5 seconds for response
            failureThreshold: 3  # After 3 failed checks, restart the pod
          resources:
            requests:
              # Kubernetes reserves this much (guaranteed)
              cpu: 100m  # 100 millicores (1/10 of one CPU)
              memory: 128Mi  # 128 megabytes
            limits:
              # Pod can't use more than this. HPA uses these requests to calculate CPU %
              cpu: 500m  # Max 500 millicores
              memory: 256Mi  # Max 256 megabytes
          securityContext:
            # Security rules: limit what the app can do
            allowPrivilegeEscalation: false  # Can't become root later
            readOnlyRootFilesystem: false  # Filesystem is writable (app needs to write logs)
            capabilities:
              drop:
                - ALL  # Drop all dangerous Linux capabilities

