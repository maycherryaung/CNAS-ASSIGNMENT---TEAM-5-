apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: cnas-local-storage
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: cnas-mysql-pv
  labels:
    app.kubernetes.io/name: cnas-mysql
    app.kubernetes.io/component: database
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: cnas-local-storage
  local:
    path: /mnt/cnas-mysql
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - vm-childnode1
