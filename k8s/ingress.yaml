apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cnas-web
  namespace: cnas
  labels:
    app.kubernetes.io/name: cnas-web
    app.kubernetes.io/component: gateway
  annotations:
    cert-manager.io/cluster-issuer: cnas-ca-issuer
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - cnas.local
      secretName: cnas-web-tls
  rules:
    - host: cnas.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cnas-web
                port:
                  number: 80
