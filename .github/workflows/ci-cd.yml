name: Secure CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io

jobs:
  validate-build-scan:
    name: Validate, Build, and Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mysqli, pdo_mysql
          coverage: none

      - name: PHP syntax check
        run: find . -maxdepth 1 -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Docker Compose configuration check
        run: docker compose config

      - name: Render Kubernetes manifests
        run: kubectl kustomize k8s > rendered-k8s.yaml

      - name: Validate Kubernetes manifests with kubeconform
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" ghcr.io/yannh/kubeconform:latest \
            -strict \
            -summary \
            -ignore-missing-schemas \
            /work/rendered-k8s.yaml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: local/cnas-php-mysql:${{ github.sha }}

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: local/cnas-php-mysql:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  push-image:
    name: Push Image
    runs-on: ubuntu-latest
    needs: validate-build-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare lowercase image name
        run: echo "IMAGE_REF=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker buildx build --push \
            -t "${IMAGE_REF}:${GITHUB_SHA}" \
            -t "${IMAGE_REF}:latest" \
            .

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: push-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare lowercase image name
        run: echo "IMAGE_REF=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig from secret
        run: |
          mkdir -p "${HOME}/.kube"
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > "${HOME}/.kube/config"
          chmod 600 "${HOME}/.kube/config"

      - name: Apply manifests with release image
        run: |
          kubectl kustomize k8s > rendered-k8s.yaml
          sed -i "s#image: cnas-php-mysql:local#image: ${IMAGE_REF}:${GITHUB_SHA}#" rendered-k8s.yaml
          kubectl apply -f rendered-k8s.yaml
          kubectl -n cnas rollout status deployment/cnas-web --timeout=180s
